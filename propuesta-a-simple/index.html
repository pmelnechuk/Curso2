<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Híbrido Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Híbrido Box — sistema de gestión.
   Layout: panel con barra lateral en escritorio, barra inferior en celular; todo en tarjetas blancas sobre gris claro.
   Color neutro; verde / amarillo / rojo reservados para estados. Un solo tema claro, deliberado. */
:root{
  color-scheme: light;
  --bg:#f4f5f4; --surface:#ffffff; --soft:#eff1f0; --line:#e3e6e4; --line-2:#d3d7d5;
  --ink:#171a19; --ink-2:#3d4341; --muted:#6b7270; --primary:#171a19; --on-primary:#ffffff;
  --ok:#15803d; --ok-bg:#e7f4ec; --warn:#a15c07; --warn-bg:#fdf2dc; --warn-dot:#e0a412; --bad:#c22a2a; --bad-bg:#fdeaea;
  --font:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px; --r-sm:10px; --shadow:0 1px 2px rgba(23,26,25,.05), 0 1px 1px rgba(23,26,25,.03);
  --frame:#1d201f;
}
*{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;flex:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

/* barra de demo */
.demobar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.demobar .who{display:flex;align-items:center;gap:10px;min-width:0}
.demobar .who img{width:30px;height:30px;border-radius:50%}
.demobar .who b{font-weight:600}
.demobar .who span{color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg .ic{width:17px;height:17px}

.stage{flex:1;min-height:0;display:flex;position:relative}
.stage-owner>.app,.stage-owner>.login-wrap{flex:1}
.app{position:relative;container:app/inline-size;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;background:var(--bg)}
.scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.content{display:flex;flex-direction:column;gap:16px;padding:20px 16px 28px;max-width:1180px;margin:0 auto}

/* shell dueño */
.shell{flex:1;min-height:0;display:flex}
.side{display:none;width:240px;flex:none;flex-direction:column;gap:20px;padding:18px 12px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand img{width:38px;height:38px;border-radius:50%}
.brand b{display:block;font-weight:600}
.brand small{color:var(--muted);font-size:12.5px}
.side-nav{display:flex;flex-direction:column;gap:2px}
.nav-i{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;color:var(--ink-2);font-weight:500}
.nav-i:hover{background:var(--soft)}
.nav-i[aria-current="page"]{background:var(--soft);color:var(--ink);font-weight:600}
.badge{margin-left:auto;background:var(--bad-bg);color:var(--bad);font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.me{display:flex;align-items:center;gap:10px;padding:10px 8px 0;border-top:1px solid var(--line)}
.me b{display:block;font-size:14px;font-weight:600}
.me small{color:var(--muted);font-size:12.5px}
.me .icon-btn{margin-left:auto}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar,.ph-head{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar img,.ph-head img{width:30px;height:30px;border-radius:50%}
.topbar b,.ph-head b{font-weight:600;flex:1}
.tabbar{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:500;color:var(--muted);border-radius:10px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ic{stroke-width:2.2}
.tab-cta{color:var(--ink)}
.tab-cta .ic{background:var(--primary);color:var(--on-primary);width:40px;height:30px;padding:5px 10px;border-radius:10px}
@container app (min-width:900px){
  .side{display:flex}
  .topbar,.owner-app .tabbar{display:none}
  .content{padding:32px 36px 40px}
}

/* encabezado de vista */
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vh h1{font-size:26px;font-weight:650}
.vh p{color:var(--muted);margin-top:2px}
.vh-a{display:flex;gap:8px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:500;align-self:flex-start;margin-bottom:-4px}
.back .ic{width:18px;height:18px}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);font-weight:550;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn .ic{width:18px;height:18px}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:#2c302e}
.btn-sm{height:34px;padding:0 12px;font-size:13.5px;border-radius:9px}
.btn-lg{height:52px;font-size:16px;padding:0 20px;border-radius:13px}
.btn-block{width:100%}
.btn-ghost{border-color:transparent;background:var(--soft)}
.link{color:var(--ink-2);font-weight:550;font-size:14px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;color:var(--muted)}
.icon-btn:hover{background:var(--soft);color:var(--ink)}

/* tarjetas y listas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
section.card{padding:6px 0 4px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px 8px}
.card-h h2,.card-h h3{font-size:15.5px;font-weight:620}
.card-h small{color:var(--muted)}
.list{display:flex;flex-direction:column}
.card.list{padding:4px 0}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 18px;min-height:64px;border-top:1px solid var(--line)}
.list>.row:first-child,.list>.empty:first-child{border-top:0}
button.row:hover,.row-link:hover .row-main b{background:var(--soft)}
.row-link:hover .row-main b{background:none;text-decoration:underline;text-underline-offset:3px}
.row-static{gap:10px}
.row-link{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-main b{font-weight:580;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-main small{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row-end{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.row-end small{color:var(--muted);font-size:12.5px}
.row-acts{display:flex;gap:6px;flex:none}
.chev{color:var(--line-2);width:18px;height:18px}
.av{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--ink-2);font-weight:600;font-size:13.5px;flex:none;letter-spacing:.02em}
.av-lg{width:56px;height:56px;font-size:18px}
.av-sm{width:30px;height:30px;font-size:11.5px}
.av-ghost{background:var(--soft);color:var(--muted)}
.av-ghost .ic{width:18px;height:18px}
.empty{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;padding:36px 18px;color:var(--muted)}
.empty b{color:var(--ink)}
.foot-note{color:var(--muted);font-size:12.5px;text-align:center}

/* estados */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill-ok{background:var(--ok-bg);color:var(--ok)}
.pill-warn{background:var(--warn-bg);color:var(--warn)}
.pill-warn i{background:var(--warn-dot)}
.pill-bad{background:var(--bad-bg);color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.dot-ok{background:var(--ok)} .dot-warn{background:var(--warn-dot)} .dot-bad{background:var(--bad)} .dot-idle{background:var(--line-2)}
.t-ok{color:var(--ok)!important} .t-warn{color:var(--warn)!important} .t-bad{color:var(--bad)!important} .t-idle{color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--soft);color:var(--muted);vertical-align:1px;margin-left:4px}
.tag-live{background:var(--ink);color:var(--surface)}

/* indicadores */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:2px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);text-align:left;min-width:0}
.stat:not([disabled]):hover{border-color:var(--line-2)}
.stat[disabled]{cursor:default}
.stat-l{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;font-weight:500}
.stat-v{font-size:30px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat-s{color:var(--muted);font-size:12.5px}
@container app (min-width:700px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stats-3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.grid2{display:grid;gap:16px;align-items:start}
@container app (min-width:1000px){.grid2{grid-template-columns:1.35fr 1fr}}
.income{padding-bottom:12px!important}
.income-v{font-size:34px;font-weight:650;letter-spacing:-.02em;padding:0 18px}
.income-s{padding:2px 18px 12px;color:var(--muted);font-size:13.5px}
.kv{margin:0;display:grid;gap:0}
.kv>div{display:flex;justify-content:space-between;gap:12px;padding:11px 18px;border-top:1px solid var(--line)}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:550;text-align:right;min-width:0;overflow-wrap:anywhere}
@container app (min-width:700px){.kv-2{grid-template-columns:1fr 1fr}.kv-2>div:nth-child(odd){border-right:1px solid var(--line)}}

/* toolbar y chips */
.toolbar{display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;color:var(--muted);width:100%}
.search:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px rgba(23,26,25,.08)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font-size:15.5px}
.search-fake span{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-size:13.5px;font-weight:550;white-space:nowrap;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip-n{font-weight:500;opacity:.6;font-variant-numeric:tabular-nums}
.chip em{font-style:normal;font-weight:500;opacity:.65;margin-left:2px}

/* perfil */
.profile{padding:18px;display:flex;flex-direction:column;gap:16px}
.p-id{display:flex;align-items:center;gap:14px;min-width:0}
.p-id h1{font-size:22px;font-weight:650}
.p-id h2{font-size:16px;font-weight:620}
.p-id p{color:var(--muted);font-size:13.5px}
.status-box{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px 16px;border-radius:12px;background:var(--soft)}
.status-box strong{font-size:18px;font-weight:620}
.status-box small{color:var(--muted)}
.sb-ok{background:var(--ok-bg)} .sb-warn{background:var(--warn-bg)} .sb-bad{background:var(--bad-bg)}
.p-actions{display:grid;grid-template-columns:1fr;gap:8px}
@container app (min-width:520px){.p-actions{grid-template-columns:1fr 1fr}}

/* clases */
.days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;padding:8px 0;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.day small{color:var(--muted);font-size:12px;font-weight:500}
.day b{font-size:18px;font-weight:620}
.day.is-today small{color:var(--ink);font-weight:650}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.day[aria-pressed="true"] small{color:inherit;opacity:.7}
.cls-time{display:flex;flex-direction:column;width:52px;flex:none}
.cls-time b{font-family:var(--mono);font-weight:600;font-size:15px}
.cls-time small{color:var(--muted);font-size:12px}
.cls.is-done{opacity:.55}
.cupo{display:flex;flex-direction:column;align-items:flex-end;gap:5px;width:72px;flex:none}
.cupo small{color:var(--muted);font-size:12.5px}
.bar{display:block;width:100%;height:6px;border-radius:9px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink-2);border-radius:9px}
.coach-grid{display:grid;gap:12px}
@container app (min-width:760px){.coach-grid{grid-template-columns:1fr 1fr}}
.coach{padding:16px 0 4px!important}
.coach .p-id{padding:0 18px 12px}

/* profesor */
.hello p{color:var(--muted);font-size:13.5px}
.hello h1{font-size:26px;font-weight:650}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-height:118px}
.qbtn .ic{width:26px;height:26px;margin-bottom:auto}
.qbtn b{font-size:16px;font-weight:620}
.qbtn small{color:var(--muted);font-size:12.5px}
.qbtn-primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.qbtn-primary small{color:inherit;opacity:.7}
.next-class{display:flex;flex-direction:column;gap:10px;padding:16px 18px;text-align:left;width:100%}
.nc-l{color:var(--muted);font-size:12.5px;font-weight:550}
.nc-m{display:flex;align-items:center;gap:14px}
.nc-m>b{font-family:var(--mono);font-size:24px;font-weight:600}
.nc-m span{display:flex;flex-direction:column}
.nc-m small{color:var(--muted);font-size:13px}
.next-class .cupo{width:100%;align-items:stretch}

/* hojas */
.overlay{position:absolute;inset:0;z-index:20;background:rgba(23,26,25,.36);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.12);animation:up .22s cubic-bezier(.2,.8,.2,1)}
@container app (min-width:700px){.overlay{align-items:center}.sheet{width:520px;border-radius:20px;max-height:86%}}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 18px 10px}
.sheet-h h2{font-size:19px;font-weight:650}
.sheet-h p{color:var(--muted);font-size:13.5px;margin-top:2px}
.sheet-b{overflow:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:16px}
.sheet-b .list .row{padding-left:0;padding-right:0}
.sheet-b .card-h{padding:4px 0 0}
.sheet-b .kv>div{padding-left:0;padding-right:0}
.sheet-f{display:flex;gap:8px;padding-top:4px}
.sheet-f .btn{flex:1}
.sheet-hint{color:var(--muted);font-size:13px}
.pay-who{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--soft)}
.fgroup{display:flex;flex-direction:column;gap:8px}
.fgroup .chips{flex-wrap:wrap;overflow:visible}
.flabel,.field>span{font-size:13px;font-weight:600;color:var(--ink-2)}
.sum>div{border-top:1px solid var(--line);padding-left:0;padding-right:0}
.form{display:flex;flex-direction:column;gap:14px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select{height:46px;padding:0 12px;border:1px solid var(--line-2);border-radius:11px;background:var(--surface);font-size:15.5px;width:100%;min-width:0}
.field input:focus,.field select:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 3px rgba(23,26,25,.08)}
.check{display:flex;align-items:center;gap:10px;font-weight:550}
.check input{width:20px;height:20px;accent-color:var(--ink)}
.form-err{color:var(--bad);font-size:13.5px;font-weight:550;min-height:1px}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:6px 0 4px}
.done-i{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--ok-bg);color:var(--ok)}
.done-i .ic{width:32px;height:32px;stroke-width:2.4}
.done>b{font-size:30px;font-weight:650}
.done p{color:var(--muted)}
.done .status-box{align-self:stretch;align-items:center;margin-top:8px}

.toast-root{position:absolute;left:0;right:0;bottom:84px;z-index:30;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--surface);font-weight:550;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:up .2s ease;transition:opacity .3s}
.toast .ic{color:#7bd99b}
.toast.out{opacity:0}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(16px);opacity:0}}

/* login */
.login-wrap{display:grid;place-items:center;padding:24px 16px;overflow:auto;background:var(--bg)}
.login{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px;padding:28px 24px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 40px rgba(23,26,25,.06)}
.login-logo{width:76px;height:76px;border-radius:50%;margin-bottom:4px}
.login h1{font-size:24px;font-weight:650}
.login-sub{color:var(--muted);margin-top:-8px;margin-bottom:6px}
.link-center{align-self:center;margin-top:2px}

/* profesor: marco de teléfono */
.stage-prof{align-items:center;justify-content:center;gap:56px;padding:24px 16px;overflow:auto}
.prof-wrap{display:flex;align-items:center;gap:56px;height:100%}
.phone{width:390px;height:min(820px,100%);flex:none;padding:10px;border-radius:52px;background:var(--frame);box-shadow:0 30px 60px -20px rgba(23,26,25,.35);display:flex}
.phone>.app{flex:1;border-radius:42px}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:12px 28px 4px;background:var(--surface);font-size:14px}
.sbar .ic{width:16px;height:16px;color:var(--muted)}
.prof-notes{max-width:300px;display:flex;flex-direction:column;gap:14px;color:var(--ink-2)}
.prof-notes h2{font-size:22px;font-weight:650}
.prof-notes ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.prof-notes p{color:var(--muted)}
@media (max-width:860px){.prof-notes{display:none}}
@media (max-width:520px){
  .stage-prof{padding:0}
  .prof-wrap{width:100%}
  .phone{width:100%;height:100%;padding:0;border-radius:0;background:none;box-shadow:none}
  .phone>.app{border-radius:0}
  .sbar{display:none}
}

/* recepción: tablet */
.stage-tablet{flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;overflow:auto}
.tab-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;height:100%;justify-content:center}
.tablet{height:min(720px,calc(100% - 64px));aspect-ratio:4/3;max-width:100%;padding:14px;border-radius:34px;background:var(--frame);box-shadow:0 30px 60px -20px rgba(23,26,25,.35);display:flex}
.kiosk{flex:1;min-width:0;border-radius:22px;background:var(--surface);container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4cqmin 6cqmin;position:relative;overflow:hidden}
.k-top{position:absolute;top:4cqmin;left:5cqmin;right:5cqmin;display:flex;align-items:center;justify-content:space-between}
.k-top img{width:12cqmin;height:12cqmin;border-radius:50%}
.k-clock{font-family:var(--mono);font-size:3.6cqmin;color:var(--muted)}
.k-form{display:flex;flex-direction:column;align-items:center;gap:3cqmin;width:min(76cqmin,100%)}
.k-label{font-size:7cqmin;font-weight:650;letter-spacing:-.02em}
.k-input{width:100%;height:13cqmin;border:2px solid var(--line-2);border-radius:2.6cqmin;text-align:center;font-family:var(--mono);font-size:7cqmin;letter-spacing:.12em;background:var(--bg);outline:0}
.k-input::placeholder{color:var(--line-2);letter-spacing:.02em;font-family:var(--font);font-size:5cqmin}
.k-input:focus{border-color:var(--ink);background:var(--surface)}
.k-btn{width:100%;height:11cqmin;font-size:4.4cqmin;border-radius:2.4cqmin}
.k-hint{color:var(--muted);font-size:3.2cqmin}
.k-hint.is-err{color:var(--bad);font-weight:600}
kbd{font-family:var(--mono);font-size:.9em;padding:1px 7px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;background:var(--surface)}
.k-res{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1.6cqmin;width:100%;animation:up .25s ease}
.k-badge{display:grid;place-items:center;width:16cqmin;height:16cqmin;border-radius:50%;margin-bottom:1cqmin}
.k-badge .ic{width:8cqmin;height:8cqmin;stroke-width:2.4}
.k-ok .k-badge,.k-res.k-ok .k-badge{background:var(--ok-bg);color:var(--ok)}
.k-warn .k-badge{background:var(--warn-bg);color:var(--warn)}
.k-bad .k-badge{background:var(--bad-bg);color:var(--bad)}
.k-missing .k-badge{background:var(--soft);color:var(--muted)}
.k-name{font-size:8.5cqmin;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.k-status{display:flex;align-items:center;gap:1.4cqmin;font-size:4.2cqmin;font-weight:620}
.k-status .dot{width:2.4cqmin;height:2.4cqmin}
.k-ok .k-status{color:var(--ok)} .k-warn .k-status{color:var(--warn)} .k-bad .k-status{color:var(--bad)}
.k-venc{font-size:3.8cqmin;color:var(--ink-2)}
.k-note{font-size:3.4cqmin;padding:1.8cqmin 3cqmin;border-radius:2cqmin;max-width:80cqmin;background:var(--soft)}
.k-bad .k-note{background:var(--bad-bg);color:#8f1f1f;font-weight:550}
.k-warn .k-note{background:var(--warn-bg);color:#7a4605}
.k-res p.k-ok{display:flex;align-items:center;gap:1.2cqmin;font-size:3.4cqmin;color:var(--muted);margin-top:1.4cqmin}
.k-res p.k-ok .ic{width:3.6cqmin;height:3.6cqmin;color:var(--ok)}
.k-timer{position:absolute;left:0;right:0;bottom:0;height:1cqmin;background:var(--soft)}
.k-timer i{display:block;height:100%;background:var(--ink-2);animation:timer linear forwards}
@keyframes timer{from{width:100%}to{width:0}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.ck-help{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;max-width:100%}
.ck-help>span{font-size:13px;color:var(--muted);font-weight:550;margin-right:4px}
@media (max-width:700px){
  .stage-tablet{padding:0}
  .tab-wrap{gap:0;justify-content:flex-start}
  .tablet{height:auto;flex:1;width:100%;aspect-ratio:auto;padding:0;border-radius:0;background:none;box-shadow:none;min-height:480px}
  .kiosk{border-radius:0}
  .ck-help{padding:12px 16px;background:var(--surface);border-top:1px solid var(--line);width:100%}
}
@media (max-width:560px){.hide-sm{display:none}.cupo{width:56px}.row{padding-left:14px;padding-right:14px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}.k-timer i{animation-duration:var(--d,6s)!important}}
</style>
</head>
<body>
<header class="demobar">
  <div class="who"><img src="../assets/logo-hibrido-box.png" alt=""><div><b>Híbrido Box</b> <span>Sistema de gestión</span></div></div>
  <div class="seg" role="group" aria-label="Vista">
    <button data-role="owner" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Dueño</button>
    <button data-role="prof" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2"/><path d="M11 18.5h2"/></svg>Profesor</button>
    <button data-role="tablet" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="2"/><path d="M11 18.5h2"/></svg>Recepción</button>
  </div>
