<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Híbrido Box · Propuesta B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Propuesta B — Premium / fitness.
   Layout: mismo esqueleto que la A, con identidad del box: grafito oscuro, verde del logo, tipografía condensada de pizarra de WOD.
   Indicadores grandes en Anton; texto en Barlow; cifras en Barlow Condensed. Un solo tema oscuro, deliberado. */
:root{
  color-scheme: dark;
  --bg:#0b0c0c; --surface:#141616; --surface-2:#1b1e1e; --soft:#202424; --line:#262a2a; --line-2:#363b3b;
  --ink:#f1f3f1; --ink-2:#c5cac7; --muted:#878e8b; --chalk:#5b605e;
  --brand:#22d360; --brand-ink:#04140a; --brand-soft:rgba(34,211,96,.12);
  --ok:#3ddc74; --ok-bg:rgba(61,220,116,.12); --warn:#f5b941; --warn-bg:rgba(245,185,65,.13); --warn-dot:#f5b941; --bad:#ff6159; --bad-bg:rgba(255,97,89,.13);
  --display:"Anton", "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --font:"Barlow", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --cond:"Barlow Condensed", "Arial Narrow", ui-sans-serif, sans-serif;
  --r:18px; --frame:#000;
}
*{box-sizing:border-box}
html{height:100%;box-sizing:border-box;background:var(--bg)}
body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:15.5px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.num{font-family:var(--cond);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.ic{width:20px;height:20px;flex:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

/* barra de demo */
.demobar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 16px;background:#000;border-bottom:1px solid var(--line)}
.demobar .who{display:flex;align-items:center;gap:10px;min-width:0}
.demobar .who img{width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 1px var(--line-2)}
.demobar .who b{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.demobar .who span{color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.seg .ic{width:17px;height:17px}

.stage{flex:1;min-height:0;display:flex;position:relative}
.stage-owner>.app,.stage-owner>.login-wrap{flex:1}
.app{position:relative;container:app/inline-size;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;background:var(--bg)}
.scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.content{display:flex;flex-direction:column;gap:18px;padding:20px 16px 28px;max-width:1220px;margin:0 auto}

/* shell dueño */
.shell{flex:1;min-height:0;display:flex}
.side{display:none;width:248px;flex:none;flex-direction:column;gap:22px;padding:20px 14px;background:#000;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.brand img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 1px var(--line-2)}
.brand b{display:block;font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.brand small{color:var(--muted);font-size:12.5px}
.side-nav{display:flex;flex-direction:column;gap:2px}
.nav-i{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:12px;color:var(--muted);font-weight:600}
.nav-i:hover{background:var(--surface);color:var(--ink)}
.nav-i[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
.nav-i[aria-current="page"] .ic{color:var(--brand)}
.badge{margin-left:auto;background:var(--bad);color:#1a0403;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.me{display:flex;align-items:center;gap:10px;padding:12px 6px 0;border-top:1px solid var(--line)}
.me b{display:block;font-size:14px;font-weight:600}
.me small{color:var(--muted);font-size:12.5px}
.me .icon-btn{margin-left:auto}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar,.ph-head{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#000;border-bottom:1px solid var(--line)}
.topbar img,.ph-head img{width:32px;height:32px;border-radius:50%}
.topbar b,.ph-head b{flex:1;font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.05em;text-transform:uppercase}
.tabbar{display:flex;background:#000;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:10px;text-transform:uppercase;letter-spacing:.04em}
.tab[aria-current="page"]{color:var(--brand)}
.tab-cta{color:var(--ink)}
.tab-cta .ic{background:var(--brand);color:var(--brand-ink);width:44px;height:32px;padding:5px 11px;border-radius:11px;stroke-width:2.2}
@container app (min-width:900px){
  .side{display:flex}
  .topbar,.owner-app .tabbar{display:none}
  .content{padding:30px 36px 44px}
}

/* encabezados */
.eyebrow{font-family:var(--cond);font-weight:600;font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vh h1{font-family:var(--display);font-weight:400;font-size:38px;line-height:1;letter-spacing:.01em;text-transform:uppercase}
.vh p{color:var(--muted);margin-top:6px;font-family:var(--cond);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:13.5px}
.vh-a{display:flex;gap:8px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:600;align-self:flex-start;margin-bottom:-6px;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.back .ic{width:18px;height:18px}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);font-weight:700;white-space:nowrap;text-transform:uppercase;letter-spacing:.05em;font-size:13.5px}
.btn:hover{border-color:var(--chalk)}
.btn .ic{width:18px;height:18px}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:#3fe377;border-color:#3fe377}
.btn-sm{height:34px;padding:0 13px;font-size:12px;border-radius:10px}
.btn-lg{height:54px;font-size:15px;padding:0 22px;border-radius:14px}
.btn-block{width:100%}
.btn-ghost{border-color:transparent;background:var(--soft)}
.link{color:var(--brand);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}

/* tarjetas y listas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
section.card{padding:8px 0 4px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px 10px}
.card-h h2,.card-h h3{font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.03em;text-transform:uppercase}
.card-h small{color:var(--muted);font-family:var(--cond);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.list{display:flex;flex-direction:column}
.card.list{padding:4px 0}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 20px;min-height:66px;border-top:1px solid var(--line)}
.list>.row:first-child,.list>.empty:first-child{border-top:0}
button.row:hover{background:var(--surface-2)}
.row-link:hover .row-main b{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--chalk)}
.row-static{gap:10px}
.row-link{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-main b{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-main small{color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row-end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.row-end small{color:var(--muted);font-size:13px}
.row-end b.num{font-size:18px;font-weight:700}
.row-acts{display:flex;gap:6px;flex:none}
.chev{color:var(--chalk);width:18px;height:18px}
.av{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2);font-family:var(--cond);font-weight:700;font-size:16px;flex:none;letter-spacing:.04em}
.av-lg{width:62px;height:62px;font-size:24px;border-radius:16px}
.av-sm{width:32px;height:32px;font-size:13px;border-radius:9px}
.av-ghost{color:var(--muted)}
.av-ghost .ic{width:18px;height:18px}
.empty{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;padding:36px 18px;color:var(--muted)}
.empty b{color:var(--ink)}
.foot-note{color:var(--muted);font-size:12.5px;text-align:center}

/* estados */
.pill{display:inline-flex;align-items:center;gap:6px;height:25px;padding:0 10px;border-radius:7px;font-family:var(--cond);font-size:13.5px;font-weight:700;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill-ok{background:var(--ok-bg);color:var(--ok)}
.pill-warn{background:var(--warn-bg);color:var(--warn)}
.pill-bad{background:var(--bad-bg);color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.dot-ok{background:var(--ok)} .dot-warn{background:var(--warn)} .dot-bad{background:var(--bad)} .dot-idle{background:var(--chalk)} .dot-brand{background:var(--brand)}
.t-ok{color:var(--ok)!important} .t-warn{color:var(--warn)!important} .t-bad{color:var(--bad)!important} .t-idle{color:var(--muted)}
.tag{display:inline-block;font-family:var(--cond);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:6px;background:var(--soft);color:var(--muted);vertical-align:2px;margin-left:6px}
.tag-live{background:var(--brand);color:var(--brand-ink)}

/* indicadores */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{position:relative;display:flex;flex-direction:column;gap:4px;padding:16px 18px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:left;min-width:0;overflow:hidden}
.stat:not([disabled]):hover{border-color:var(--line-2);background:var(--surface-2)}
.stat[disabled]{cursor:default}
.stat-l{display:flex;align-items:center;gap:7px;font-family:var(--cond);color:var(--muted);font-size:13.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.stat-v{font-family:var(--display);font-size:52px;line-height:1.02;letter-spacing:.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat-s{color:var(--muted);font-size:13px}
.stat-warn .stat-v{color:var(--warn)} .stat-bad .stat-v{color:var(--bad)} .stat-brand .stat-v{color:var(--brand)}
.stat-money .stat-v{font-size:40px;padding-top:8px}
.stats-5{grid-template-columns:repeat(2,minmax(0,1fr))}
.stats-5 .stat:last-child{grid-column:1/-1}
@container app (min-width:700px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stats-3{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container app (min-width:1000px){
  .stats-5{grid-template-columns:1.3fr 1fr 1fr 1fr}
  .stats-5 .stat:first-child{grid-column:auto;grid-row:span 2}
  .stats-5 .stat:first-child .stat-v{font-size:110px;margin-top:auto}
  .stats-5 .stat:last-child{grid-column:span 3}
}
.grid2{display:grid;gap:18px;align-items:start}
@container app (min-width:1000px){.grid2{grid-template-columns:1.3fr 1fr}}
.kv{margin:0;display:grid}
.kv>div{display:flex;justify-content:space-between;gap:12px;padding:12px 20px;border-top:1px solid var(--line)}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
@container app (min-width:700px){.kv-2{grid-template-columns:1fr 1fr}.kv-2>div:nth-child(odd){border-right:1px solid var(--line)}}
.income-v,.income-s{padding:0 20px}
.income-v{font-family:var(--display);font-size:40px}
.income-s{color:var(--muted);padding-bottom:12px}

/* gráfico de asistencias */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:170px;padding:6px 20px 0}
.wk{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.wk b{font-family:var(--cond);font-weight:700;font-size:15px;color:var(--ink-2)}
.wk i{display:block;width:100%;max-width:38px;border-radius:7px 7px 3px 3px;background:var(--line-2)}
.wk.is-today i{background:var(--brand)}
.wk.is-today b{color:var(--brand)}
.wk-l{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding:8px 20px 16px;border-bottom:1px solid var(--line)}
.wk-l span{text-align:center;font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wk-l span.is-today{color:var(--ink)}
.now-row .cls-time b{color:var(--brand)}

/* toolbar y chips */
.toolbar{display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:10px;height:50px;padding:0 15px;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;color:var(--muted);width:100%}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font-size:16px}
.search-fake span{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-family:var(--cond);font-size:15px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip-n{opacity:.55;font-variant-numeric:tabular-nums}
.chip em{font-style:normal;opacity:.6;margin-left:2px}

/* perfil */
.profile{padding:20px;display:flex;flex-direction:column;gap:16px;background:linear-gradient(160deg,var(--surface-2),var(--surface) 60%)}
.p-id{display:flex;align-items:center;gap:14px;min-width:0}
.p-id h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.p-id h2{font-family:var(--display);font-weight:400;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.p-id p{color:var(--muted);font-size:14px;margin-top:4px}
.status-box{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px 18px;border-radius:14px;background:var(--soft);border:1px solid var(--line-2)}
.status-box strong{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.02em;text-transform:uppercase}
.status-box small{color:var(--muted)}
.sb-ok{background:var(--ok-bg);border-color:rgba(61,220,116,.28)} .sb-warn{background:var(--warn-bg);border-color:rgba(245,185,65,.3)} .sb-bad{background:var(--bad-bg);border-color:rgba(255,97,89,.3)}
.p-actions{display:grid;grid-template-columns:1fr;gap:8px}
@container app (min-width:520px){.p-actions{grid-template-columns:1fr 1fr}}

/* clases */
.days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.day small{font-family:var(--cond);color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.day b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1}
.day.is-today small{color:var(--brand)}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day[aria-pressed="true"] small{color:inherit;opacity:.7}
.cls-time{display:flex;flex-direction:column;width:58px;flex:none}
.cls-time b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1;letter-spacing:.02em}
.cls-time small{color:var(--muted);font-size:12px}
.cls.is-done{opacity:.45}
.cupo{display:flex;flex-direction:column;align-items:flex-end;gap:6px;width:78px;flex:none}
.cupo small{color:var(--muted);font-size:13px}
.bar{display:block;width:100%;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:9px}
.coach-grid{display:grid;gap:12px}
@container app (min-width:760px){.coach-grid{grid-template-columns:1fr 1fr}}
.coach{padding:18px 0 4px!important}
.coach .p-id{padding:0 20px 14px}

/* profesor */
.hello p{font-family:var(--cond);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-size:13.5px}
.hello h1{font-family:var(--display);font-weight:400;font-size:44px;line-height:1.02;text-transform:uppercase}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);min-height:128px}
.qbtn .ic{width:28px;height:28px;margin-bottom:auto}
.qbtn b{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em}
.qbtn small{color:var(--muted);font-size:13px}
.qbtn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.qbtn-primary small{color:inherit;opacity:.7}
.next-class{display:flex;flex-direction:column;gap:12px;padding:16px 18px;text-align:left;width:100%;background:linear-gradient(135deg,var(--surface-2),var(--surface))}
.nc-l{font-family:var(--cond);color:var(--brand);font-size:13.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.nc-m{display:flex;align-items:center;gap:14px}
.nc-m>b{font-family:var(--display);font-weight:400;font-size:40px;line-height:1}
.nc-m span{display:flex;flex-direction:column}
.nc-m span b{font-weight:700;font-size:17px}
.nc-m small{color:var(--muted);font-size:13.5px}
.next-class .cupo{width:100%;align-items:stretch}

/* hojas */
.overlay{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease;backdrop-filter:blur(3px)}
.sheet{width:100%;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-2);border-bottom:0;border-radius:22px 22px 0 0;animation:up .22s cubic-bezier(.2,.8,.2,1)}
@container app (min-width:700px){.overlay{align-items:center}.sheet{width:540px;border-radius:22px;border-bottom:1px solid var(--line-2);max-height:86%}}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:20px 20px 10px}
.sheet-h h2{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em}
.sheet-h p{color:var(--muted);font-size:14px;margin-top:4px}
.sheet-b{overflow:auto;padding:4px 20px 20px;display:flex;flex-direction:column;gap:16px}
.sheet-b .list .row{padding-left:0;padding-right:0}
.sheet-b .card-h{padding:4px 0 0}
.sheet-b .kv>div{padding-left:0;padding-right:0}
.sheet-f{display:flex;gap:8px;padding-top:4px}
.sheet-f .btn{flex:1}
.sheet-hint{color:var(--muted);font-size:13.5px}
.pay-who{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.fgroup{display:flex;flex-direction:column;gap:8px}
.fgroup .chips{flex-wrap:wrap;overflow:visible}
.flabel,.field>span{font-family:var(--cond);font-size:13.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sum>div{border-top:1px solid var(--line);padding-left:0;padding-right:0}
.sum dd{font-size:20px;color:var(--brand)}
.form{display:flex;flex-direction:column;gap:14px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select{height:48px;padding:0 13px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface-2);font-size:16px;width:100%;min-width:0}
.field input:focus,.field select:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--brand)}
.form-err{color:var(--bad);font-size:14px;font-weight:600;min-height:1px}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:6px 0 4px}
.done-i{display:grid;place-items:center;width:70px;height:70px;border-radius:50%;background:var(--brand);color:var(--brand-ink)}
.done-i .ic{width:34px;height:34px;stroke-width:2.6}
.done>b{font-family:var(--display);font-weight:400;font-size:52px;line-height:1.05}
.done p{color:var(--muted)}
.done .status-box{align-self:stretch;align-items:center;margin-top:8px}

.toast-root{position:absolute;left:0;right:0;bottom:84px;z-index:30;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:up .2s ease;transition:opacity .3s}
.toast .ic{color:#119a42}
.toast.out{opacity:0}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(16px);opacity:0}}

/* login */
.login-wrap{display:grid;grid-template-columns:1fr;overflow:auto;background:var(--bg)}
.login-art{display:none;position:relative;overflow:hidden;padding:48px;flex-direction:column;justify-content:space-between;background:#000;border-right:1px solid var(--line)}
.login-art::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,transparent 0 22px,rgba(255,255,255,.025) 22px 23px)}
.login-art>*{position:relative}
.login-art .big{font-family:var(--display);font-size:clamp(64px,8vw,128px);line-height:.9;text-transform:uppercase;letter-spacing:.005em}
.login-art .big span{color:var(--brand)}
.login-art p{color:var(--muted);max-width:420px;font-size:16px}
.login-art .facts{display:flex;gap:36px}
.login-art .facts b{display:block;font-family:var(--display);font-size:40px;font-weight:400}
.login-art .facts span{font-family:var(--cond);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-size:13px}
.login-side{display:grid;place-items:center;padding:24px 16px}
.login{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.login-logo{width:96px;height:96px;border-radius:50%;margin-bottom:8px;box-shadow:0 0 0 1px var(--line-2),0 0 60px rgba(34,211,96,.12)}
.login h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;text-transform:uppercase}
.login-sub{color:var(--muted);margin-bottom:8px}
.link-center{align-self:center;margin-top:4px}
@media (min-width:960px){.login-wrap{grid-template-columns:1.1fr 1fr}.login-art{display:flex}}

/* profesor: marco de teléfono */
.stage-prof{align-items:center;justify-content:center;gap:56px;padding:24px 16px;overflow:auto;background:radial-gradient(ellipse at 30% 40%,#16201a,var(--bg) 60%)}
.prof-wrap{display:flex;align-items:center;gap:64px;height:100%}
.phone{width:390px;height:min(820px,100%);flex:none;padding:10px;border-radius:52px;background:var(--frame);box-shadow:0 0 0 1px #2a2e2e,0 40px 80px -20px rgba(0,0,0,.8);display:flex}
.phone>.app{flex:1;border-radius:42px}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:12px 28px 4px;background:#000;font-size:15px}
.sbar b{font-family:var(--cond);font-weight:700}
.sbar .ic{width:16px;height:16px;color:var(--muted)}
.prof-notes{max-width:320px;display:flex;flex-direction:column;gap:14px;color:var(--ink-2)}
.prof-notes h2{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;text-transform:uppercase}
.prof-notes h2 span{color:var(--brand)}
.prof-notes ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.prof-notes li{display:flex;gap:12px;align-items:baseline;counter-increment:s}
.prof-notes li::before{content:counter(s);font-family:var(--display);font-size:24px;color:var(--brand);width:18px;flex:none}
.prof-notes p{color:var(--muted)}
@media (max-width:860px){.prof-notes{display:none}}
@media (max-width:520px){
  .stage-prof{padding:0}
  .prof-wrap{width:100%}
  .phone{width:100%;height:100%;padding:0;border-radius:0;background:none;box-shadow:none}
  .phone>.app{border-radius:0}
  .sbar{display:none}
}

/* recepción: tablet */
.stage-tablet{flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;overflow:auto;background:radial-gradient(ellipse at 50% 30%,#141c17,var(--bg) 65%)}
.tab-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;height:100%;justify-content:center}
.tablet{height:min(720px,calc(100% - 64px));aspect-ratio:4/3;max-width:100%;padding:14px;border-radius:34px;background:var(--frame);box-shadow:0 0 0 1px #2a2e2e,0 40px 80px -20px rgba(0,0,0,.8);display:flex}
.kiosk{flex:1;min-width:0;border-radius:22px;background:#070808;container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4cqmin 6cqmin;position:relative;overflow:hidden}
.kiosk{isolation:isolate}
.kiosk::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 50% 120%,rgba(34,211,96,.10),transparent 55%);pointer-events:none}
.k-top{position:absolute;top:4cqmin;left:5cqmin;right:5cqmin;display:flex;align-items:center;justify-content:space-between}
.k-top img{width:13cqmin;height:13cqmin;border-radius:50%;box-shadow:0 0 0 1px var(--line-2)}
.k-clock{font-family:var(--display);font-size:5cqmin;color:var(--ink-2)}
.k-form{display:flex;flex-direction:column;align-items:center;gap:3cqmin;width:min(80cqmin,100%)}
.k-label{font-family:var(--display);font-size:10cqmin;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.k-input{width:100%;height:14cqmin;border:2px solid var(--line-2);border-radius:3cqmin;text-align:center;font-family:var(--display);font-size:8cqmin;letter-spacing:.14em;background:var(--surface);color:var(--ink);outline:0}
.k-input::placeholder{color:var(--chalk);letter-spacing:.04em;font-size:5.5cqmin}
.k-input:focus{border-color:var(--brand);box-shadow:0 0 0 1cqmin var(--brand-soft)}
.k-btn{width:100%;height:12cqmin;font-size:4.4cqmin;border-radius:3cqmin;letter-spacing:.12em}
.k-hint{color:var(--muted);font-size:3.2cqmin}
.k-hint.is-err{color:var(--bad);font-weight:600}
kbd{font-family:var(--cond);font-weight:700;font-size:.95em;padding:1px 8px;border:1px solid var(--line-2);border-bottom-width:3px;border-radius:6px;background:var(--surface-2);color:var(--ink)}
.k-res{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1.8cqmin;width:100%;animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.k-badge{display:grid;place-items:center;width:17cqmin;height:17cqmin;border-radius:50%;margin-bottom:1cqmin;border:.8cqmin solid}
.k-badge .ic{width:8cqmin;height:8cqmin;stroke-width:2.6}
.k-ok .k-badge{color:var(--ok);border-color:var(--ok);background:var(--ok-bg);box-shadow:0 0 6cqmin rgba(61,220,116,.25)}
.k-warn .k-badge{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.k-bad .k-badge{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}
.k-missing .k-badge{color:var(--muted);border-color:var(--line-2)}
.k-name{font-family:var(--display);font-weight:400;font-size:13cqmin;line-height:.95;text-transform:uppercase;letter-spacing:.01em}
.k-status{display:flex;align-items:center;gap:1.4cqmin;font-family:var(--cond);font-size:5cqmin;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.k-status .dot{width:2.4cqmin;height:2.4cqmin}
.k-ok .k-status{color:var(--ok)} .k-warn .k-status{color:var(--warn)} .k-bad .k-status{color:var(--bad)}
.k-venc{font-size:4cqmin;color:var(--ink-2)}
.k-venc b{font-size:1.15em;color:var(--ink)}
.k-note{font-size:3.4cqmin;padding:1.8cqmin 3.2cqmin;border-radius:2cqmin;max-width:84cqmin;background:var(--surface-2)}
.k-bad .k-note{background:var(--bad-bg);color:#ffd2cf;border:1px solid rgba(255,97,89,.3)}
.k-warn .k-note{background:var(--warn-bg);color:#ffe7b5}
.k-res p.k-ok{display:flex;align-items:center;gap:1.2cqmin;font-size:3.4cqmin;color:var(--ink-2);margin-top:1.4cqmin;font-weight:600}
.k-res p.k-ok .ic{width:3.8cqmin;height:3.8cqmin;color:var(--ok)}
.k-timer{position:absolute;left:0;right:0;bottom:0;height:1cqmin;background:var(--line)}
.k-timer i{display:block;height:100%;background:var(--brand);animation:timer linear forwards}
.k-bad .k-timer i{background:var(--bad)}
@keyframes timer{from{width:100%}to{width:0}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.ck-help{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;max-width:100%}
.ck-help>span{font-family:var(--cond);font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-right:4px}
.ck-help .chip{height:34px;font-size:14px}
@media (max-width:700px){
  .stage-tablet{padding:0}
  .tab-wrap{gap:0;justify-content:flex-start}
  .tablet{height:auto;flex:1;width:100%;aspect-ratio:auto;padding:0;border-radius:0;background:none;box-shadow:none;min-height:480px}
  .kiosk{border-radius:0}
  .ck-help{padding:12px 16px;background:#000;border-top:1px solid var(--line);width:100%}
}
@media (max-width:560px){.hide-sm{display:none}.cupo{width:56px}.row{padding-left:14px;padding-right:14px}.vh h1{font-size:34px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>
<header class="demobar">
  <div class="who"><img src="../assets/logo-hibrido-box.png" alt=""><div><b>Propuesta B · Premium</b> <span>Híbrido Box</span></div></div>
  <div class="seg" role="group" aria-label="Vista">
    <button data-role="owner" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Dueño</button>
    <button data-role="prof" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2"/><path d="M11 18.5h2"/></svg>Profesor</button>
    <button data-role="tablet" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="2"/><path d="M11 18.5h2"/></svg>Recepción</button>
  </div>
</header>
<main class="stage" id="stage"></main>
<script src="../shared/hibrido-core.js"></script>
<script>
(function () {
  const { T, S, ic } = HB, { money, fShort, cap, MESES, DIAS } = HB.util, { BASE, CLASES } = HB.data, F = HB.fn;
  HB.logo = '../assets/logo-hibrido-box.png';

  // Dashboard con métricas grandes, "Necesitan atención" y semana de asistencias
  T.dashboard = () => {
    const att = F.atencion().slice(0, 6);
    const ing = BASE.ingresos + S.extraIng;
    const pct = Math.round((ing / BASE.mesAnt - 1) * 100);
    const today = new Date();
    const vals = [38, 44, 41, 52, 47, 29, BASE.hoy + S.newCk];
    const max = Math.max(...vals);
    const lbl = vals.map((_, i) => { const d = new Date(today); d.setDate(d.getDate() - (6 - i)); return i === 6 ? 'Hoy' : HB.util.DIAS[d.getDay()].slice(0, 3); });
    const live = CLASES.filter(c => c.dow === today.getDay() && F.clsState(c) !== 'done').sort((a, b) => a.hora.localeCompare(b.hora)).slice(0, 3);
    return `<header class="vh"><div class="vh-t"><span class="eyebrow">${cap(DIAS[today.getDay()])} ${fShort(today)}</span><h1>Buen día, Martín</h1></div>
      <div class="vh-a"><button class="btn" data-act="new-socio">${ic('plus')}Nuevo socio</button><button class="btn btn-primary" data-act="pay">${ic('card')}Registrar pago</button></div></header>
    <div class="stats stats-5">
      ${T.stat('Socios activos', BASE.activos + S.nuevos, `de ${BASE.total + S.nuevos} registrados · +9 este mes`, 'socios', 'brand')}
      ${T.stat('Vencimientos esta semana', BASE.semana, 'Hasta el domingo', 'venc', 'warn')}
      ${T.stat('Cuotas vencidas', BASE.vencidas, 'Sin renovar', 'venc', 'bad')}
      ${T.stat('Asistencias hoy', BASE.hoy + S.newCk, `Promedio diario: ${BASE.prom}`, 'asist')}
      <button class="stat stat-money" data-go="pagos"><span class="stat-l">Ingresos del mes</span><span class="stat-v">${money(ing)}</span><span class="stat-s"><span class="t-ok">${pct >= 0 ? '+' : ''}${pct}%</span> respecto de ${MESES[(today.getMonth() + 11) % 12]} · ${BASE.nPagos + S.nPagos} pagos</span></button>
    </div>
    <div class="grid2">
      <section class="card"><div class="card-h"><h2>Necesitan atención</h2><button class="link" data-go="venc">Ver todo</button></div><div class="list">${att.map(T.rowAtt).join('')}</div></section>
      <section class="card"><div class="card-h"><h2>Asistencias</h2><small>Últimos 7 días</small></div>
        <div class="week" role="img" aria-label="Asistencias por día: ${vals.join(', ')}">${vals.map((v, i) => `<div class="wk ${i === 6 ? 'is-today' : ''}"><b>${v}</b><i style="height:${Math.round(v / max * 100)}%"></i></div>`).join('').replace(/height:(\d+)%/g, (m, p) => `height:calc(${p}% - 28px)`)}</div>
        <div class="wk-l">${lbl.map((l, i) => `<span class="${i === 6 ? 'is-today' : ''}">${l}</span>`).join('')}</div>
        <div class="card-h"><h3>Hoy en el box</h3><button class="link" data-go="clases">Agenda</button></div>
        <div class="list">${live.map(c => T.rowClase(c)).join('') || F.empty('No quedan clases hoy')}</div>
      </section>
    </div>`;
  };

  T.login = () => `<div class="login-wrap">
    <div class="login-art"><span class="eyebrow">Híbrido Box · Gestión</span>
      <div class="big">Vos entrená.<br><span>Las cuentas</span><br>van solas.</div>
      <div class="facts"><div><b>184</b><span>Socios activos</span></div><div><b>46</b><span>Ingresos hoy</span></div><div><b>34</b><span>Clases por semana</span></div></div></div>
    <div class="login-side"><form class="login" data-form="login" novalidate>
      <img class="login-logo" src="${HB.logo}" alt="Híbrido Box">
      <h1>Ingresá a tu box</h1><p class="login-sub">Socios, pagos y clases en un solo lugar</p>
      <label class="field"><span>Email</span><input id="l-email" type="email" value="martin@hibridobox.com.ar" autocomplete="username"></label>
      <label class="field"><span>Contraseña</span><input id="l-pass" type="password" value="hibrido2026" autocomplete="current-password"></label>
      <button class="btn btn-primary btn-lg btn-block" type="submit">Ingresar</button>
      <button class="link link-center" type="button" data-act="forgot">Olvidé mi contraseña</button>
    </form></div></div>`;

  HB.profNotes = `<h2>El box en <span>tu bolsillo</span></h2>
    <p>Pensado para el profesor: una mano, entre clase y clase.</p>
    <ol><li>Tocá <b>Cobrar</b></li><li>Elegí al socio</li><li>Confirmá. Plan y medio de pago ya vienen cargados.</li></ol>
    <p>También busca socios, los da de alta y ve quién está anotado en cada clase.</p>`;
  HB.boot();
})();
</script>
</body>
</html>
